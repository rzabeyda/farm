<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Free Stars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--card:#0e0710;--line:#2a1230;--txt:#fff;--dim:#a58bb0;--pink:#ff2bd6;--pink2:#b400ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,43,214,.16),transparent 55%);pointer-events:none;animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.45}}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));animation:down .5s both}
@keyframes down{from{opacity:0;transform:translateY(-14px)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.bal{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;text-shadow:0 0 18px rgba(255,43,214,.7)}
.bal small{display:block;font-size:11px;color:var(--dim);font-weight:500;text-shadow:none}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.25);color:var(--pink)}}
.invite{background:linear-gradient(135deg,var(--pink),var(--pink2));border:0;color:#fff;border-radius:20px;padding:10px 14px;font-size:13px;font-weight:700;box-shadow:0 0 18px rgba(255,43,214,.45);transition:transform .12s}
main{flex:1;overflow:auto;padding:8px 16px 16px}
.tab{display:none}.tab.on{display:block;animation:up .4s both}
#home.on{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center}
.star{font-size:104px;line-height:1;filter:drop-shadow(0 0 28px rgba(255,43,214,.8));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(6deg) scale(1.05)}}
.star.pop{animation:pop .7s}@keyframes pop{30%{transform:scale(1.5) rotate(-12deg)}}
.hint{color:var(--dim);margin:16px 0 28px;font-size:15px}
.claim{width:100%;max-width:340px;border:0;border-radius:18px;padding:19px;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 0 30px rgba(255,43,214,.55);transition:transform .12s;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 48px rgba(255,43,214,.9)}}
.claim:active,.invite:active,.wd:active{transform:scale(.94)}
.claim:disabled{background:var(--card);color:var(--dim);border:1px solid var(--line);box-shadow:none;animation:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;transition:transform .12s,border-color .2s;animation:up .5s both}
.card:nth-child(2){animation-delay:.08s}
.card:active{transform:scale(.98);border-color:var(--pink)}
.row{display:flex;justify-content:space-between;padding:7px 0;color:var(--dim)}.row b{color:var(--txt)}
.wd{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;margin-top:8px;transition:transform .12s}
.wd:disabled{background:var(--line);color:var(--dim)}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:rgba(0,0,0,.85)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:10px 0 12px;font-size:12px;transition:.2s}
nav button span{display:block;font-size:22px;transition:transform .2s}nav button.on{color:var(--pink);text-shadow:0 0 12px var(--pink)}
nav button.on span{transform:translateY(-3px) scale(1.15)}
#toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);background:var(--pink);color:#fff;font-weight:700;padding:10px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;font-size:14px;box-shadow:0 0 20px rgba(255,43,214,.6)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="bal"><span>⭐</span><div><span id="bal">0</span><small>баланс звёзд</small></div></div>
    <button class="invite" id="inv">👥 Пригласить друга</button>
  </header>
  <main>
    <section class="tab on" id="home">
      <div class="star">⭐</div>
      <div class="hint" id="hint">Нажми раз в день, чтобы получить звезду</div>
      <button class="claim" id="claim">Я не бот!</button>
    </section>
    <section class="tab" id="profile">
      <div class="card">
        <div class="row"><span>Награда в день</span><b id="p-daily">1</b></div>
        <div class="row"><span>Активных друзей</span><b id="p-refs">0</b></div>
        <div class="row"><span>Приглашено всего</span><b id="p-total">0</b></div>
        <div class="row"><span>Дней подряд</span><b id="p-streak">0</b></div>
        <div class="row"><span>На выводе</span><b id="p-pend">0</b></div>
      </div>
      <div class="card">
        <div class="row" style="padding-top:0"><span>Вывод в Telegram Stars</span><b id="p-min"></b></div>
        <button class="wd" id="wd">Вывести</button>
      </div>
      <div class="hint" style="font-size:13px;text-align:center">Каждый друг, который зашёл и нажал «Я не бот», даёт +1% к ежедневной награде.</div>
    </section>
  </main>
  <nav>
    <button class="on" data-t="home"><span>⭐</span>Звёзды</button>
    <button data-t="profile"><span>👤</span>Профиль</button>
  </nav>
</div>
<div id="toast"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
try{tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000')}catch(e){}
const hap=(t='light')=>{try{tg.HapticFeedback.impactOccurred(t)}catch(e){}};
document.addEventListener('click',e=>{if(e.target.closest('button,.card'))hap()});
const $=id=>document.getElementById(id);let S=null;
const fmt=n=>(+n).toFixed(2).replace(/\.?0+$/,'')||'0';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
async function api(p){
  const r=await fetch('/api/'+p,{method:'POST',headers:{'X-Init-Data':tg.initData}});
  if(!r.ok)throw new Error(r.status);return r.json();
}
function render(){
  $('bal').textContent=fmt(S.balance);
  const c=$('claim');c.disabled=S.claimed_today;
  c.textContent=S.claimed_today?'Приходи завтра ✔':'Я не бот!';
  $('hint').textContent=S.claimed_today?'Награда на сегодня получена':'Нажми, чтобы получить +'+fmt(S.daily)+' ⭐';
  $('p-daily').textContent=fmt(S.daily)+' ⭐';$('p-refs').textContent=S.refs;
  $('p-total').textContent=S.refs_total;$('p-streak').textContent=S.streak;
  $('p-pend').textContent=fmt(S.pending)+' ⭐';$('p-min').textContent='мин. '+S.min_withdraw+' ⭐';
  $('wd').disabled=S.balance<S.min_withdraw;
}
$('claim').onclick=async()=>{
  try{S=await api('claim');render();try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}$('bal').classList.remove('bump');void $('bal').offsetWidth;$('bal').classList.add('bump');document.querySelector('.star').classList.add('pop');toast('+'+fmt(S.reward)+' ⭐')}
  catch(e){toast('Ошибка, попробуй ещё раз')}
};
$('wd').onclick=()=>tg.showConfirm('Вывести '+Math.floor(S.balance)+' ⭐?',async ok=>{
  if(!ok)return;try{S=await api('withdraw');render();toast('Заявка отправлена')}catch(e){toast('Не удалось')}
});
$('inv').onclick=()=>{
  const u='https://t.me/share/url?url='+encodeURIComponent(S.link)+'&text='+encodeURIComponent('Заходи, получай бесплатные ⭐ Telegram Stars каждый день!');
  tg.openTelegramLink(u);
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$(b.dataset.t).classList.add('on');
});
api('me').then(s=>{S=s;render()}).catch(()=>toast('Открой приложение через Telegram'));
</script>
</body>
</html>
