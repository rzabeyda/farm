<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Free Stars</title>
<link rel="icon" href="/static/star.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#000;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);
  --txt:#fff;--dim:#a39a86;--pink:#ffb800;--pink2:#ff8a00;--grad:linear-gradient(135deg,#ffd84d,#ff9f0a);--on:#2b1a00;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--txt);
  font-family:Inter,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
svg{display:block}

/* ===== рамка смартфона: на любом экране приложение = размер телефона ===== */
body{display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 0,#1c1400 0,#000 60%)}
#app{position:relative;display:flex;flex-direction:column;overflow:hidden;
  width:100%;height:100%;max-width:430px;background:#000;isolation:isolate}
@media (min-width:600px){
  #app{height:min(900px,96vh);border-radius:44px;border:1px solid var(--line);
    box-shadow:0 0 0 8px #0b0b0d,0 0 90px rgba(255,184,0,.28),0 40px 100px rgba(0,0,0,.8)}
}
/* фоновое свечение */
#app:before,#app:after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none}
#app:before{width:320px;height:320px;left:-90px;top:-60px;background:rgba(255,184,0,.32);animation:drift 9s ease-in-out infinite alternate}
#app:after{width:300px;height:300px;right:-100px;bottom:60px;background:rgba(255,138,0,.28);animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(40px,50px) scale(1.15)}}

/* ===== шапка ===== */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(16px + env(safe-area-inset-top)) 16px 10px;animation:down .6s both}
.bal{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px)}
.bal .ic{width:32px;height:32px;border-radius:50%;background:#050505;border:1.5px solid #ffc01f;display:grid;place-items:center;
  box-shadow:0 0 18px rgba(255,184,0,.6)}
.bal b{display:block;font-size:19px;font-weight:800;line-height:1.1;letter-spacing:-.3px}
.bal{gap:9px;padding:6px 6px 6px 7px}.bal .bl{font-size:10.5px;line-height:1.25;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.bn{min-width:62px;text-align:center;padding:7px 15px;border-radius:999px;background:var(--grad);color:var(--on);box-shadow:0 0 18px rgba(255,184,0,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.bn b{font-size:19px;font-variant-numeric:tabular-nums}.bn.bump{animation:bumpn .55s}@keyframes bumpn{35%{transform:scale(1.2)}}
.bal small{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.invite{display:flex;align-items:center;gap:7px;border:0;color:var(--on);font-weight:700;font-size:13px;
  padding:11px 15px;border-radius:999px;background:var(--grad);box-shadow:0 6px 24px rgba(255,184,0,.45);
  transition:transform .15s}
.bump{animation:bump .55s}
img{display:block;-webkit-user-drag:none;pointer-events:none}.fx img{width:100%;height:100%}nav button img{filter:grayscale(1) opacity(.55);transition:.25s}nav button.on img{filter:none}.bal .ic img{width:20px;height:20px}
@keyframes bump{35%{transform:scale(1.22);color:#ffe27a}}
@keyframes down{from{opacity:0;transform:translateY(-16px)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}}

/* ===== контент ===== */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px 14px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.tab{display:none;min-height:100%}
.tab.on{display:block;animation:up .45s both}
#home.on{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}

/* главная кнопка с кольцами */
.orb{position:relative;width:210px;height:210px;margin:0 0 6px;display:grid;place-items:center}
.orb i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,184,0,.45);animation:ring 3.2s linear infinite}
.orb i:nth-child(2){animation-delay:1.06s}.orb i:nth-child(3){animation-delay:2.12s}
@keyframes ring{from{transform:scale(.62);opacity:.9}to{transform:scale(1.18);opacity:0}}
.claim{position:relative;width:156px;height:156px;border-radius:50%;border:2px solid #ffc01f;color:#fff;
  background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:19px;font-weight:800;letter-spacing:-.2px;
  box-shadow:inset 0 0 30px rgba(255,184,0,.18),0 0 55px rgba(255,184,0,.5),0 20px 50px rgba(255,138,0,.3);
  transition:transform .15s,filter .3s;animation:breath 2.6s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.045)}}
.claim:active{transform:scale(.93);animation:none}
.claim img{filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(8deg)}}
.claim.done{border-color:var(--line);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--dim);animation:none;font-size:15px}
.claim.done img{animation:none;opacity:.5}
.orb.off i{display:none}
.claim.pop img{animation:pop .7s}
@keyframes pop{30%{transform:scale(1.7) rotate(-14deg)}}
.title{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:2px 0 0}
.sub{color:var(--dim);font-size:14.5px;line-height:1.4;max-width:290px}
.chips{display:flex;gap:8px;margin-top:16px}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);transition:transform .15s}

/* карточки */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;
  backdrop-filter:blur(16px);transition:transform .15s,border-color .25s,box-shadow .25s;animation:up .5s both}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:active{transform:scale(.975);border-color:rgba(255,184,0,.6);box-shadow:0 0 28px rgba(255,184,0,.25)}
.me{display:flex;align-items:center;gap:14px}
.ava{width:56px;height:56px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
  font-size:24px;font-weight:800;box-shadow:0 0 24px rgba(255,184,0,.5);overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.me b{font-size:18px;display:block}.me span{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:18px;padding:14px;transition:transform .15s}
.stat:active{transform:scale(.95)}
.stat small{color:var(--dim);font-size:11.5px;display:block;margin-bottom:6px}
.stat b{font-size:22px;font-weight:800;letter-spacing:-.4px}
.stat b em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);box-shadow:0 0 14px var(--pink);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.lbl b{color:var(--txt)}
.wd{width:100%;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:800;color:var(--on);
  background:var(--grad);box-shadow:0 8px 28px rgba(255,184,0,.4);transition:transform .15s}
.wd:disabled{background:rgba(255,255,255,.06);color:var(--dim);box-shadow:none}
.invite:active,.wd:active:not(:disabled),.chip:active{transform:scale(.94)}
.fl{margin-top:2px}.fl .row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-top:1px solid var(--line);font-size:14px;font-weight:600}.fl .row:first-of-type{border-top:0}.pg{color:var(--dim);font-weight:500;font-size:11.5px}.fl .row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}.fl .mk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}.fl .mk.y{background:rgba(52,211,153,.16);color:#34d399}.fl .mk.n{background:rgba(255,69,58,.16);color:#ff4d4d;box-shadow:0 0 12px rgba(255,69,58,.25)}.fl .empty{color:var(--dim);font-size:13px;text-align:center;padding:10px 0 2px}.fl h4{margin:0 0 6px;font-size:14px}
.wcard{width:100%;margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}.wcard .bar{height:6px;margin:8px 0 10px}.wcard .wd{padding:11px;font-size:14px;border-radius:13px}.wcard .lbl{font-size:12px}
.card.me{padding:10px 14px;gap:12px}.me .ava{width:42px;height:42px;font-size:18px}.me b{font-size:16px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.mini{padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.mini small{display:block;color:var(--dim);font-size:11px}.mini b{font-size:20px;font-weight:800}.mini b em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card.fl{padding:4px 14px}.fl .row{padding:9px 0;font-size:13.5px}.fl .mk{width:22px;height:22px}
.sheet{position:absolute;inset:0;z-index:15;display:flex;align-items:flex-end;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .box{width:100%;background:#15110a;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.sheet.on .box{transform:none}
.sheet .grab{width:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 16px}
.sheet h3{margin:0 0 4px;font-size:21px;letter-spacing:-.4px}
.sheet .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin:2px 0 12px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.sheet p{margin:0 0 12px;color:var(--dim);font-size:14px;line-height:1.5}
.sheet .r{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--dim)}.sheet .r b{color:var(--txt)}
.sheet .go{width:100%;margin-top:14px;border:0;border-radius:16px;padding:15px;font-size:15px;font-weight:800;color:var(--on);background:var(--grad);box-shadow:0 8px 28px rgba(255,184,0,.35);transition:transform .15s;display:flex;align-items:center;justify-content:center;gap:8px}.sheet .go:active{transform:scale(.96)}
.sheet .go.low{background:rgba(255,184,0,.14);color:var(--pink);box-shadow:inset 0 0 0 1px rgba(255,184,0,.35)}.sheet .go.alt{background:rgba(255,184,0,.12);color:var(--pink);box-shadow:inset 0 0 0 1.5px rgba(255,184,0,.5);margin-top:8px}.sheet .go.ghost{background:rgba(255,255,255,.07);color:var(--txt);box-shadow:none;margin-top:8px}
.card.fl .empty{padding:18px 0 14px}.card.fl .empty .go{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;font-size:14px;border-radius:13px;width:100%;border:0;font-weight:800;color:var(--on);background:var(--grad)}
.bal,.mini,.wcard,.orb{cursor:pointer}
.streak{padding:12px 14px;cursor:pointer}.sr-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);margin-bottom:10px}.sr-top b{color:var(--txt);font-size:14px}.sr-top em{font-style:normal;font-size:18px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.days i{display:grid;place-items:center;height:34px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);font-style:normal;font-size:11.5px;font-weight:700}.days i.on{background:var(--grad);border-color:transparent;color:var(--on)}.days i.cur{border-color:var(--pink);color:var(--txt)}
.btns{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}.btns .wd{width:100%}.hist{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font-size:14px;font-weight:700;padding:11px;border-radius:13px}.hist:active{transform:scale(.95)}.wd.low{background:rgba(255,184,0,.14);color:var(--pink);box-shadow:inset 0 0 0 1px rgba(255,184,0,.35)}
.stcard{padding:12px 14px;cursor:pointer}.st-sub{font-size:12.5px;color:var(--dim)}
.tier{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;margin-top:10px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tier b{display:block;font-size:16px;margin-bottom:2px}.tier small{color:var(--dim);font-size:12.5px}
.tier .buy{flex:none;border:0;border-radius:13px;padding:10px 14px;font-weight:800;font-size:13.5px;color:var(--on);background:var(--grad);display:flex;align-items:center;gap:6px}.tier .buy img{width:15px;height:15px}
.tier .buy:disabled{background:rgba(255,255,255,.08);color:var(--dim)}
.t-gold b,b.t-gold{color:#ffc01f}.t-platinum b,b.t-platinum{color:#d6dde8}.t-diamond b,b.t-diamond{color:#ff2bd6}.tier.cur{border-color:var(--pink)}
/* ===== анимации ===== */
button,.mini,.wcard,.card,nav button,.tier{position:relative;overflow:hidden}
.claim{overflow:visible}
.rp{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,224,130,.55),rgba(255,184,0,0) 70%);transform:scale(0);animation:rp .65s ease-out forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
.invite:after,.wd:not(:disabled):not(.low):after,.sheet .go:not(.ghost):not(.low):after,.tier .buy:not(:disabled):after,nav button.on:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-70%}100%{left:130%}}
.orb:before{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,0,.35),transparent 68%);filter:blur(14px);animation:glow 2.6s ease-in-out infinite}
.orb.off:before{display:none}
@keyframes glow{50%{transform:scale(1.18);opacity:.55}}
.claim:not(.done):after{content:"";position:absolute;inset:-2px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,216,77,.9) 85%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tab.on>*{animation:up .55s cubic-bezier(.2,.9,.25,1) both}
.tab.on>*:nth-child(1){animation-delay:0s}.tab.on>*:nth-child(2){animation-delay:.06s}.tab.on>*:nth-child(3){animation-delay:.12s}.tab.on>*:nth-child(4){animation-delay:.18s}.tab.on>*:nth-child(5){animation-delay:.24s}.tab.on>*:nth-child(6){animation-delay:.3s}
.mini,.wcard,.stat,.tier{transition:transform .2s cubic-bezier(.3,1.5,.5,1),border-color .25s,box-shadow .25s}
.mini:active,.wcard:active{transform:scale(.95);border-color:rgba(255,184,0,.6);box-shadow:0 0 26px rgba(255,184,0,.25)}
.mini:before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:var(--grad);opacity:.55;transform:scaleX(0);transform-origin:left;animation:ln 1s .5s ease-out forwards}
@keyframes ln{to{transform:scaleX(1)}}
.fl .row{animation:up .45s both}.fl .row:nth-child(2){animation-delay:.05s}.fl .row:nth-child(3){animation-delay:.1s}.fl .row:nth-child(4){animation-delay:.15s}.fl .row:nth-child(n+5){animation-delay:.2s}
.fl .mk.y{animation:ok .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes ok{from{transform:scale(0) rotate(-90deg)}}
.sheet .box>*{animation:up .45s both}.sheet .box>*:nth-child(3){animation-delay:.05s}.sheet .tier,.sheet .r{animation:up .45s both}
.sheet .tier:nth-of-type(1){animation-delay:.08s}.sheet .tier:nth-of-type(2){animation-delay:.16s}.sheet .tier:nth-of-type(3){animation-delay:.24s}
.sheet .big{animation:pop2 .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop2{from{transform:scale(.6);opacity:0}}
.tier.cur{animation:cur 2.4s ease-in-out infinite}
@keyframes cur{50%{box-shadow:0 0 22px rgba(255,184,0,.35)}}
.t-diamond.cur{animation-name:curd}
@keyframes curd{50%{box-shadow:0 0 22px rgba(255,43,214,.45)}}
.t-diamond b{background:linear-gradient(90deg,#ff2bd6,#ff9be9,#ff2bd6);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.t-gold b{background:linear-gradient(90deg,#ffb800,#fff1a8,#ffb800);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3.4s linear infinite}
.bal .ic img,.nav img{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.12) rotate(6deg)}}
nav button.on img{animation:tw 3s ease-in-out infinite}
.bar i{background-size:200% 100%;animation:barm 2.4s linear infinite}
@keyframes barm{to{background-position:-200% 0}}
.bar i{background-image:linear-gradient(90deg,#ffb800,#ffe27a,#ffb800)}
#toast{transition:.45s cubic-bezier(.2,1.6,.4,1)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* ===== сияющие VIP ===== */
.tier.t-gold{background:linear-gradient(135deg,rgba(255,214,70,.22),rgba(255,140,0,.07) 60%,rgba(255,200,60,.16));border-color:rgba(255,200,60,.55);box-shadow:0 0 22px rgba(255,184,0,.22),inset 0 0 22px rgba(255,200,60,.08)}
.tier.t-platinum{background:linear-gradient(135deg,rgba(235,242,255,.2),rgba(150,165,190,.06) 60%,rgba(235,242,255,.15));border-color:rgba(220,230,245,.55);box-shadow:0 0 22px rgba(200,215,240,.2),inset 0 0 22px rgba(230,238,255,.07)}
.tier.t-diamond{background:linear-gradient(135deg,rgba(255,43,214,.26),rgba(161,0,255,.1) 55%,rgba(255,120,235,.2));border-color:rgba(255,80,225,.6);box-shadow:0 0 26px rgba(255,43,214,.32),inset 0 0 24px rgba(255,43,214,.1)}
.tier:before{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;pointer-events:none;transform:skewX(-22deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:tsh 4.2s ease-in-out infinite}
.tier.t-platinum:before{animation-delay:1.1s}.tier.t-diamond:before{animation-delay:2.2s}
@keyframes tsh{0%,50%{left:-60%}100%{left:140%}}
.tier.t-gold{animation:gl-g 2.8s ease-in-out infinite}.tier.t-platinum{animation:gl-p 3s ease-in-out infinite}.tier.t-diamond{animation:gl-d 2.6s ease-in-out infinite}
@keyframes gl-g{50%{box-shadow:0 0 34px rgba(255,184,0,.45),inset 0 0 26px rgba(255,200,60,.14)}}
@keyframes gl-p{50%{box-shadow:0 0 34px rgba(210,222,245,.4),inset 0 0 26px rgba(235,242,255,.12)}}
@keyframes gl-d{50%{box-shadow:0 0 38px rgba(255,43,214,.6),inset 0 0 28px rgba(255,43,214,.18)}}
.tier b{font-size:17px;letter-spacing:.3px}
.mini.s-gold{border-color:rgba(255,200,60,.6);background:linear-gradient(135deg,rgba(255,214,70,.2),rgba(255,140,0,.06));animation:gl-g 2.8s ease-in-out infinite}
.mini.s-platinum{border-color:rgba(220,230,245,.6);background:linear-gradient(135deg,rgba(235,242,255,.18),rgba(150,165,190,.05));animation:gl-p 3s ease-in-out infinite}
.mini.s-diamond{border-color:rgba(255,80,225,.65);background:linear-gradient(135deg,rgba(255,43,214,.24),rgba(161,0,255,.08));animation:gl-d 2.6s ease-in-out infinite}
.mini.s-gold:after,.mini.s-platinum:after,.mini.s-diamond:after{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;pointer-events:none;transform:skewX(-22deg);background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:tsh 4.2s ease-in-out infinite}
.t-platinum b,b.t-platinum{background:linear-gradient(90deg,#aab6c8,#fff,#aab6c8);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3.2s linear infinite}
b.t-gold,b.t-diamond{background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite}
b.t-gold{background-image:linear-gradient(90deg,#ffb800,#fff1a8,#ffb800)}b.t-diamond{background-image:linear-gradient(90deg,#ff2bd6,#ffb0f0,#ff2bd6)}
#sk-n,#st-name:not(.t-gold):not(.t-platinum):not(.t-diamond){background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card.me{position:relative}.badge{cursor:pointer;transition:transform .15s;margin-left:auto;display:block;background:rgba(255,255,255,.08);color:var(--dim);border:1px solid var(--line);font-size:11.5px;font-weight:800;letter-spacing:.4px;padding:5px 11px;border-radius:99px;text-transform:uppercase}
.card.me.s-gold,.card.me.s-platinum,.card.me.s-diamond{border-width:1.5px}
.card.me.s-gold{border-color:rgba(255,200,60,.7);background:linear-gradient(135deg,rgba(255,214,70,.2),rgba(255,140,0,.05) 65%);animation:gl-g 2.8s ease-in-out infinite}
.card.me.s-platinum{border-color:rgba(225,234,248,.7);background:linear-gradient(135deg,rgba(235,242,255,.18),rgba(150,165,190,.05) 65%);animation:gl-p 3s ease-in-out infinite}
.card.me.s-diamond{border-color:rgba(255,80,225,.75);background:linear-gradient(135deg,rgba(255,43,214,.24),rgba(161,0,255,.08) 65%);animation:gl-d 2.6s ease-in-out infinite}
.card.me.s-gold .ava{box-shadow:0 0 0 2.5px #ffc01f,0 0 22px rgba(255,184,0,.6)}
.card.me.s-platinum .ava{box-shadow:0 0 0 2.5px #dfe7f3,0 0 22px rgba(210,222,245,.55)}
.card.me.s-diamond .ava{box-shadow:0 0 0 2.5px #ff2bd6,0 0 24px rgba(255,43,214,.7)}
.badge:active{transform:scale(.9)}.card.me[class*=s-] .badge{border-color:transparent}
.card.me.s-gold .badge{background:linear-gradient(135deg,#ffd84d,#ff9f0a);color:#2b1a00}
.card.me.s-platinum .badge{background:linear-gradient(135deg,#f4f8ff,#a9b6cb);color:#1c2433}
.card.me.s-diamond .badge{background:linear-gradient(135deg,#ff2bd6,#a100ff);color:#fff}
.card.me[class*=s-]:after{content:"";position:absolute;top:-20%;left:-60%;width:35%;height:140%;pointer-events:none;transform:skewX(-22deg);background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:tsh 4.2s ease-in-out infinite}
.help{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,192,31,.7);background:rgba(255,184,0,.1);color:#ffc01f;padding:0;transition:transform .15s;animation:hp 2.8s ease-in-out infinite}
.help:active{transform:scale(.88)}@keyframes hp{50%{box-shadow:0 0 16px rgba(255,184,0,.55)}}
header{gap:8px}.invite{padding:11px 13px}
@media (max-width:380px){.bal .bl{display:none}}
.inf{padding:12px 0;border-top:1px solid var(--line)}.inf:first-of-type{border-top:0}.inf h4{margin:0 0 4px;font-size:15px;color:var(--pink)}.inf p{margin:0;font-size:13.5px;line-height:1.5;color:var(--dim)}.inf b{color:var(--txt)}
#ob{display:none;position:absolute;inset:0;z-index:30;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 28%,#2a1d00 0,#000 62%)}
#ob.on{display:flex;animation:fade .35s both}@keyframes fade{from{opacity:0}}
.ob-skip{align-self:flex-end;border:0;background:none;color:var(--dim);font-size:14px;font-weight:600;padding:8px}
.ob-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:320px}
.ob-card.in{animation:obin .5s cubic-bezier(.2,.9,.25,1) both}@keyframes obin{from{opacity:0;transform:translateX(34px)}}
.ob-ic{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin-bottom:26px;background:radial-gradient(circle,rgba(255,184,0,.22),rgba(255,184,0,.04) 70%);border:1.5px solid rgba(255,192,31,.5);box-shadow:0 0 50px rgba(255,184,0,.3);color:#ffc01f;animation:float 3.2s ease-in-out infinite}
.ob-ic img{width:70px;height:70px}.ob-ic svg{width:62px;height:62px}
.ob-card h2{margin:0 0 10px;font-size:26px;letter-spacing:-.6px}.ob-card p{margin:0;color:var(--dim);font-size:15.5px;line-height:1.5}.ob-card p b{color:var(--txt)}
.ob-dots{display:flex;gap:8px;margin:14px 0 18px}.ob-dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.18);transition:.3s}.ob-dots i.on{width:26px;background:var(--grad)}
#ob .wd{width:100%;max-width:340px;padding:16px;font-size:16px}
.note{text-align:center;color:var(--dim);font-size:12.5px;line-height:1.5;padding:0 10px}

/* ===== навигация ===== */
nav{display:flex;gap:6px;margin:0 14px calc(12px + env(safe-area-inset-bottom));padding:6px;border-radius:26px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);backdrop-filter:blur(20px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;
  color:var(--dim);padding:9px 0;border-radius:20px;font-size:11.5px;font-weight:600;transition:.25s}
nav button.on{color:var(--on);background:var(--grad);box-shadow:0 6px 22px rgba(255,184,0,.45)}
nav button:active{transform:scale(.93)}

#toast{position:absolute;left:50%;top:84px;z-index:9;transform:translate(-50%,-16px) scale(.9);
  background:var(--grad);color:var(--on);font-weight:700;padding:11px 20px;border-radius:16px;font-size:14px;
  opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 36px rgba(255,184,0,.55);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* конфетти */
.fx{position:absolute;pointer-events:none;width:18px;height:18px;color:#ffc83d;z-index:8;animation:fx 1s ease-out forwards}
@keyframes fx{to{transform:translate(var(--x),var(--y)) scale(.4) rotate(220deg);opacity:0}}

/* вне Telegram */
#out{display:none;position:absolute;inset:0;z-index:20;background:#000d;backdrop-filter:blur(10px);
  flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#out.on{display:flex}
#out a{display:inline-block;text-decoration:none;color:var(--on);font-weight:800;padding:15px 26px;border-radius:16px;background:var(--grad);box-shadow:0 8px 28px rgba(255,184,0,.5)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="bal">
      <div class="ic"><img src="/static/star.png" width="20" height="20" alt="" draggable="false"></div>
      <span class="bl">Баланс<br>звёзд</span>
      <div class="bn"><b id="bal">0</b></div>
    </div>
    <button class="help" id="help" aria-label="Как играть"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9.2a3 3 0 1 1 4.6 2.5c-1 .6-1.6 1.2-1.6 2.3"/><path d="M12 18v.01"/></svg></button>
    <button class="invite" id="inv">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2b1a00" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M19 8v6M16 11h6"/></svg>
      Пригласить
    </button>
  </header>

  <main>
    <section class="tab on" id="home">
      <div class="orb" id="orb"><i></i><i></i><i></i>
        <button class="claim" id="claim">
          <img src="/static/star.png" width="50" height="50" alt="" draggable="false">
          <span id="claimTxt">Я не бот!</span>
        </button>
      </div>
      <div class="title" id="hTitle">Забери свою звезду</div>
      <div class="sub" id="hSub">Нажимай раз в день и копи Telegram Stars</div>
      <div class="wcard">
        <div class="lbl"><span>До вывода <span id="p-pend"></span></span><b id="p-prog">0 / 50</b></div>
        <div class="bar"><i id="bar"></i></div>
      </div>
    </section>

    <section class="tab" id="profile">
      <div class="card me" id="me">
        <div class="ava" id="ava">?</div>
        <div><b id="uname">Гость</b><span id="uid"></span></div>
        <div class="badge" id="badge">Новичок</div>
      </div>
      <div class="duo">
        <div class="mini"><small>Доход в день</small><b><em id="p-daily">1</em></b></div>
        <div class="mini"><small>Друзья</small><b id="p-total">0</b></div>
      </div>
      <div class="duo">
        <div class="mini" id="streak"><small>Стрик</small><b id="sk-n">0 дней</b></div>
        <div class="mini" id="stcard"><small>VIP</small><b id="st-name">Купить</b></div>
      </div>
      <div class="card fl"><div id="fl"></div></div>
    </section>
  </main>

  <nav>
    <button class="on" data-t="home">
      <img src="/static/star.png" width="23" height="23" alt="" draggable="false">Звёзды</button>
    <button data-t="profile">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/></svg>Профиль</button>
  </nav>

  <div id="ob"><button class="ob-skip" id="ob-skip">Пропустить</button><div class="ob-card" id="ob-card"></div><div class="ob-dots" id="ob-dots"></div><button class="wd" id="ob-next">Далее</button></div>
  <div class="sheet" id="sheet"><div class="box"><div class="grab"></div><h3 id="sh-t"></h3><div id="sh-b"></div></div></div>
  <div id="toast"></div>
  <div id="out">
    <img src="/static/star.png" width="64" height="64" alt="" draggable="false">
    <div class="title">Открой в Telegram</div>
    <div class="sub">Звёзды начисляются только внутри Telegram — там мы убеждаемся, что ты не бот.</div>
    <a href="https://t.me/freestars5bot" target="_blank">Открыть @freestars5bot</a>
  </div>
</div>

<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=id=>document.getElementById(id);let S=null;
const hap=(t='light')=>{try{tg.HapticFeedback.impactOccurred(t)}catch(e){try{navigator.vibrate(12)}catch(_){}}};
document.addEventListener('click',e=>{if(e.target.closest('button,.card,.stat,.chip'))hap()});
const fmt=n=>{const v=Math.round(+n*100)/100;return String(v)};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)}
async function api(p){
  const r=await fetch('/api/'+p,{method:'POST',headers:{'X-Init-Data':tg?tg.initData:''}});
  if(!r.ok)throw new Error(r.status);return r.json();
}
const INV_ICON='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2b1a00" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M19 8v6M16 11h6"/></svg>';
function closeM(){$('sheet').classList.remove('on')}
function openM(title,big,text,rows,btn,btn2,btn3){
  $('sh-t').textContent=title;
  $('sh-b').innerHTML=(big?'<div class="big">'+big+'</div>':'')+(text?'<p>'+text+'</p>':'')+(rows||[]).map(r=>'<div class="r"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')
    +(btn?'<button class="go'+(btn.low?' low':'')+'" id="sh-go">'+(btn.inv?INV_ICON:'')+btn.t+'</button>':'')+(btn2?'<button class="go alt" id="sh-go2">'+btn2.t+'</button>':'')+(btn3?'<button class="go alt" id="sh-go3">'+btn3.t+'</button>':'')+'<button class="go ghost" id="sh-x">Закрыть</button>';
  $('sh-x').onclick=closeM;if(btn)$('sh-go').onclick=()=>{closeM();btn.f()};if(btn2)$('sh-go2').onclick=()=>{btn2.f()};if(btn3)$('sh-go3').onclick=()=>{btn3.f()};
  $('sheet').classList.add('on');
}
$('sheet').onclick=e=>{if(e.target.id==='sheet')closeM()};
function leftTxt(){const n=new Date(),m=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1))-n,h=Math.floor(m/36e5),i=Math.floor(m%36e5/6e4);return h+' ч '+i+' мин'}
function invite(){
  if(!S)return;
  const u='https://t.me/share/url?url='+encodeURIComponent(S.link)+'&text='+encodeURIComponent('Заходи и получай бесплатные Telegram Stars каждый день!');
  tg?tg.openTelegramLink(u):window.open(u,'_blank');
}
const INVB={t:'Пригласить друга',inv:1,f:invite};
function mBalance(){openM('Баланс звёзд',fmt(S.balance),'Твои накопленные звёзды Telegram Stars.',[['Минимум для вывода',S.min_withdraw],['На выводе',fmt(S.pending)],['Серия дней',S.streak]],{t:Math.floor(S.balance)>=S.min_withdraw?'Вывести '+Math.floor(S.balance):'Вывести (мин. '+S.min_withdraw+')',low:Math.floor(S.balance)<S.min_withdraw,f:doWithdraw},{t:'История выплат',f:mHistory},{t:'Купить VIP',f:mStatus})}
function mIncome(){openM('Доход в день',fmt(S.max_daily),'1 звезда за твою кнопку «Я не бот!» плюс по 1 звезде за каждого друга, который нажал её сегодня.',[['Своя кнопка','1'],['Бонус VIP','+'+fmt(S.status_bonus)],['Друзей всего',S.refs],['Максимум, если нажмут все',fmt(S.max_daily)]],INVB,{t:'Купить VIP',f:mStatus})}
function mFriends(){openM('Друзья',S.friends_today+' / '+S.refs,'Друг начинает приносить звёзды после '+S.ref_min_days+' дней игры (не обязательно подряд). Дальше каждый его клик за день даёт тебе +1 звезду.',[['Нажали сегодня',S.friends_today],['Ещё не нажали',Math.max(0,S.refs-S.friends_today)]],INVB)}
function mTomorrow(){openM('Приходи завтра',leftTxt(),'Звезда за сегодня уже получена. Новая будет доступна после 00:00 по UTC.',[['Серия дней',S.streak],['Завтра можно получить','+'+fmt(S.daily)]],INVB)}
function mStreak(){openM('Стрик',S.streak+' дн.','Заходи и нажимай «Я не бот!» каждый день. Если пропустить день, серия начнётся заново.',[['Текущая серия',S.streak],['Сегодня',S.claimed_today?'получено':'ещё не получено']],S.claimed_today?INVB:null)}
async function mHistory(){
  let h=[];try{const r=await fetch('/api/history',{method:'POST',headers:{'X-Init-Data':tg?tg.initData:''}});h=await r.json()}catch(e){}
  const st={pending:'В обработке',paid:'Выплачено'};
  const d=t=>{const x=new Date(t*1000);return x.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
  openM('История выплат','',h.length?'':'Пока нет выплат. Накопи минимум '+S.min_withdraw+' звёзд и нажми «Вывести».',h.map(w=>[d(w.created)+' · '+(st[w.status]||w.status),'<span style="color:'+(w.status==='paid'?'#34d399':'var(--pink)')+'">'+Math.floor(w.amount)+'</span>']));
}
const SCOL={gold:'t-gold',platinum:'t-platinum',diamond:'t-diamond'};
function mStatus(){
  $('sh-t').textContent='VIP-уровни';
  $('sh-b').innerHTML='<p>VIP навсегда увеличивает твою награду в день. Покупка за Telegram Stars. Более высокий уровень заменяет предыдущий, оплачивается только разница.</p>'
   +S.statuses.map(s=>{const own=S.status===s.key,low=!own&&s.pay<=0;
     return '<div class="tier '+SCOL[s.key]+(own?' cur':'')+'"><div><b>'+s.name+'</b><small>+'+s.bonus+' звезд в день · цена '+s.price+'</small></div>'
     +'<button class="buy" data-k="'+s.key+'"'+(own||low?' disabled':'')+'>'+(own?'Активен':low?'Ниже':'<img src="/static/star.png" alt="">'+s.pay)+'</button></div>'}).join('')
   +'<button class="go ghost" id="sh-x">Закрыть</button>';
  $('sh-x').onclick=closeM;
  document.querySelectorAll('.tier .buy:not(:disabled)').forEach(b=>b.onclick=()=>buy(b.dataset.k));
  $('sheet').classList.add('on');
}
async function buy(k){
  try{
    const r=await fetch('/api/buy/'+k,{method:'POST',headers:{'X-Init-Data':tg?tg.initData:''}});
    if(!r.ok)throw 0;const {link}=await r.json();
    if(!tg||!tg.openInvoice){toast('Открой приложение в Telegram');return}
    tg.openInvoice(link,async st=>{if(st==='paid'){closeM();S=await api('me');render();toast('VIP активирован');try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}});
  }catch(e){toast('Не удалось создать счёт')}
}
function mWithdraw(){const b=Math.floor(S.balance),l=S.min_withdraw-b;openM('Вывод звёзд',b+' / '+S.min_withdraw,l>0?'Накопи ещё '+l+', чтобы вывести звёзды в Telegram Stars.':'Можно выводить. Нажми кнопку ниже.',[['Минимум',S.min_withdraw],['На выводе',fmt(S.pending)]],l>0?INVB:{t:'Вывести '+b,f:doWithdraw},{t:'История выплат',f:mHistory})}
function burst(){
  const c=$('claim').getBoundingClientRect(),a=$('app').getBoundingClientRect();
  for(let i=0;i<16;i++){const f=document.createElement('div');f.className='fx';f.innerHTML='<img src=/static/star.png alt= draggable=false>';
    f.style.left=(c.left-a.left+c.width/2)+'px';f.style.top=(c.top-a.top+c.height/2)+'px';
    const ang=Math.random()*6.28,d=90+Math.random()*110;
    f.style.setProperty('--x',Math.cos(ang)*d+'px');f.style.setProperty('--y',Math.sin(ang)*d+'px');
    $('app').appendChild(f);setTimeout(()=>f.remove(),1000)}
}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('button,.mini,.wcard,.card');if(!b||b.disabled||b.id==='claim')return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,d=document.createElement('span');
  d.className='rp';d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  b.appendChild(d);setTimeout(()=>d.remove(),700);
});
function animNum(el,to){
  const from=el._v==null?to:el._v;el._v=to;
  if(from===to){el.textContent=fmt(to);return}
  const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0);
}
function render(){
  animNum($('bal'),S.balance);
  const done=S.claimed_today;
  $('claim').classList.toggle('done',done);$('orb').classList.toggle('off',done);
  $('claimTxt').textContent=done?'Приходи завтра':'Я не бот!';
  $('hTitle').textContent=done?'Награда получена':'Забери свою звезду';
  $('hSub').textContent=done?'Следующая звезда через '+leftTxt():'Нажми и получи +'+fmt(S.daily)+'  — это займёт секунду';
  
  $('p-daily').textContent=fmt(S.max_daily);
  $('p-total').textContent=S.friends_today+' / '+S.refs;
  const b=Math.floor(S.balance);
  $('p-prog').textContent=b+' / '+S.min_withdraw;
  $('p-pend').textContent=S.pending>0?'(на выводе: '+fmt(S.pending)+')':'';
  const ck='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',xx='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  $('fl').innerHTML=S.friends.length?S.friends.map(f=>'<div class="row"><span>'+esc(f.name)+(f.days<S.ref_min_days?' <small class="pg">день '+f.days+' из '+S.ref_min_days+'</small>':'')+'</span><div class="mk '+(f.done?'y':'n')+'">'+(f.done?ck:xx)+'</div></div>').join(''):'<div class="empty">Пока никого нет<button class="go" id="fl-inv">'+INV_ICON+'Пригласить</button></div>';
  $('sk-n').textContent=S.streak+' '+(S.streak%10===1&&S.streak%100!==11?'день':(S.streak%10>=2&&S.streak%10<=4&&(S.streak%100<12||S.streak%100>14)?'дня':'дней'));
  const cs=S.statuses.find(x=>x.key===S.status);$('st-name').textContent=cs?cs.name:'Купить';$('st-name').className=cs?SCOL[cs.key]:'';$('stcard').className='mini'+(cs?' s-'+cs.key:'');$('me').className='card me'+(cs?' s-'+cs.key:'');$('badge').textContent=cs?cs.name:'Новичок';
  const fi=$('fl-inv');if(fi)fi.onclick=invite;
  $('bar').style.width=Math.min(100,b/S.min_withdraw*100)+'%';
}
$('claim').onclick=async()=>{
  if(S&&S.claimed_today){mTomorrow();return}
  try{S=await api('claim');render();burst();
    try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}
    const bl=$('bal').closest('.bn');bl.classList.remove('bump');void bl.offsetWidth;bl.classList.add('bump');
    toast('+'+fmt(S.reward)+' получено!')}
  catch(e){toast('Ошибка, попробуй ещё раз')}
};
function doWithdraw(){
  if(Math.floor(S.balance)<S.min_withdraw){mWithdraw();return}
  const go=async()=>{try{S=await api('withdraw');render();toast('Заявка на вывод создана')}catch(e){toast('Не удалось вывести')}};
  tg&&tg.showConfirm?tg.showConfirm('Вывести '+Math.floor(S.balance)+' звёзд?',ok=>ok&&go()):go();
}
$('inv').onclick=invite;
$('bal').closest('.bal').onclick=()=>S&&mBalance();
$('stcard').onclick=()=>S&&mStatus();
$('badge').onclick=()=>S&&mStatus();
$('streak').onclick=()=>S&&mStreak();
document.querySelectorAll('.mini')[0].onclick=()=>S&&mIncome();
document.querySelectorAll('.mini')[1].onclick=()=>S&&mFriends();
document.querySelector('.wcard').onclick=()=>S&&mBalance();
setInterval(()=>{
  if(!S||!S.claimed_today)return;
  const d=new Date().toISOString().slice(0,10);
  if(S.today&&d!==S.today){api('me').then(s=>{S=s;render()}).catch(()=>{});return}
  $('hSub').textContent='Следующая звезда через '+leftTxt();
},30000);
function mInfo(){
  const st=S?S.statuses.map(s=>s.name+' (+'+s.bonus+' в день, '+s.price+' звёзд)').join(', '):'';
  $('sh-t').textContent='Как играть';
  $('sh-b').innerHTML='<div class="tl">'
   +'<div class="inf"><h4>1. Забирай звезду</h4><p>Раз в день нажимай большую кнопку <b>«Я не бот!»</b> и получай <b>1 звезду</b>. Следующая будет доступна после 00:00 по UTC (03:00 по Москве). Бот напомнит, если забудешь.</p></div>'
   +'<div class="inf"><h4>2. Приглашай друзей</h4><p>Нажми <b>«Пригласить»</b> и отправь ссылку. Когда друг сыграет 3 дня, каждый его клик за день даёт тебе <b>+1 звезду</b>. Кто нажал сегодня, видно в профиле по галочке.</p></div>'
   +'<div class="inf"><h4>3. Стрик</h4><p>Заходи каждый день подряд. Если пропустить день, серия начнётся заново.</p></div>'
   +'<div class="inf"><h4>4. VIP</h4><p>VIP навсегда увеличивает твою награду в день: '+st+'. Более высокий уровень заменяет прежний, платится только разница. Оплата в Telegram Stars.</p></div>'
   +'<div class="inf"><h4>5. Вывод</h4><p>Накопи минимум <b>'+(S?S.min_withdraw:50)+' звёзд</b> и нажми <b>«Вывести»</b>. Заявка попадёт к админу, выплата вручную. Статус заявок смотри в «История выплат».</p></div>'
   +'</div><button class="go" id="sh-go">Показать обучение</button><button class="go ghost" id="sh-x">Закрыть</button>';
  $('sh-x').onclick=closeM;$('sh-go').onclick=()=>{closeM();showOb()};
  $('sheet').classList.add('on');
}
$('help').onclick=()=>S&&mInfo();
const OB=[
 {t:'Забирай звезду каждый день',s:'Нажми <b>«Я не бот!»</b> раз в день и получи <b>1 звезду</b> Telegram Stars.',i:'<img src="/static/star.png" alt="">'},
 {t:'Приглашай друзей',s:'За каждого друга, который играет (с 3-го дня), ты получаешь <b>+1 звезду</b> в день.',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 20c.6-3.7 3.2-5.6 6.5-5.6s5.9 1.9 6.5 5.6"/><path d="M17.5 8.5v6M14.5 11.5h6"/></svg>'},
 {t:'Покупай VIP',s:'<b>Gold, Platinum, Diamond</b> навсегда увеличивают награду за каждый день.',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>'},
 {t:'Выводи звёзды',s:'Накопи минимум и нажми <b>«Вывести»</b>. Заявка придёт админу, статус смотри в истории выплат.',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>'}
];
let obI=0;
function obDraw(){
  const o=OB[obI],c=$('ob-card');
  c.innerHTML='<div class="ob-ic">'+o.i+'</div><h2>'+o.t+'</h2><p>'+o.s+'</p>';
  c.classList.remove('in');void c.offsetWidth;c.classList.add('in');
  $('ob-dots').innerHTML=OB.map((_,i)=>'<i class="'+(i===obI?'on':'')+'"></i>').join('');
  $('ob-next').textContent=obI===OB.length-1?'Начать':'Далее';
  $('ob-skip').style.visibility=obI===OB.length-1?'hidden':'visible';
}
function showOb(){obI=0;obDraw();$('ob').classList.add('on')}
function hideOb(){$('ob').classList.remove('on');try{localStorage.setItem('fs_ob','1')}catch(e){}}
$('ob-next').onclick=()=>{if(obI<OB.length-1){obI++;obDraw()}else hideOb()};
$('ob-skip').onclick=hideOb;
function maybeOb(){let seen=false;try{seen=localStorage.getItem('fs_ob')==='1'}catch(e){}if(!seen)showOb()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$(b.dataset.t).classList.add('on');
});
const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
if(u){
  $('uname').textContent=u.first_name||u.username||'Гость';$('uid').textContent=u.username?'@'+u.username:'ID '+u.id;
  if(u.photo_url){const i=new Image();i.src=u.photo_url;$('ava').textContent='';$('ava').appendChild(i)}
  else $('ava').textContent=(u.first_name||'?')[0].toUpperCase();
}
if(!tg||!tg.initData){$('out').classList.add('on')}
else api('me').then(s=>{S=s;render();maybeOb()}).catch(()=>toast('Ошибка загрузки'));
</script>
</body>
</html>
