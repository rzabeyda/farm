<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<style>.ear{transform-box:fill-box;transform-origin:50% 100%;animation:tw 4s ease-in-out infinite}@keyframes tw{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(-14deg)}92%{transform:rotate(8deg)}}.nose{transform-box:fill-box;transform-origin:50% 50%;animation:ns 2.4s ease-in-out infinite}@keyframes ns{50%{transform:scale(1.15)}}.orange{transform-box:fill-box;transform-origin:50% 100%;animation:ob 3.2s ease-in-out infinite}@keyframes ob{50%{transform:translateY(-2px) rotate(4deg)}}.eye{transform-box:fill-box;transform-origin:50% 50%;animation:bl 4.5s infinite}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.body{transform-box:fill-box;transform-origin:50% 100%;animation:br 3.4s ease-in-out infinite}@keyframes br{50%{transform:scale(1.015,1.03)}}</style>
